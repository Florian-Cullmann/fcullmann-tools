name: fcullmann-tools

services:
  setup:
    image: fcullmann-tools-build:${RELEASE_TAG:?Set RELEASE_TAG in .env}
    profiles: [maintenance]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:deploy && npm run db:seed"]
    mem_limit: 512m
    cpus: 1

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: fcullmann_tools
      POSTGRES_USER: fcullmann_tools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcullmann_tools -d fcullmann_tools"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 1
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: fcullmann-tools:${RELEASE_TAG:?Set RELEASE_TAG in .env}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3009:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/providers').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: 1g
    cpus: 2
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
