services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fcullmann_tools
      POSTGRES_USER: fcullmann
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcullmann -d fcullmann_tools"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
